{% extends "base.html" %}
{% block title %}Captura — Metalogalva OCR{% endblock %}
{% block content %}
<div x-data="captureApp()" x-init="start()" class="capture-root" style="display:flex; flex-direction:column; min-height:calc(100vh - 0px);">

  <div class="page-h">
    <div>
      <div class="page-eyebrow">Chão de Fábrica · Captura</div>
      <h1 class="page-title">Capturar folhas</h1>
    </div>
    <span x-show="stage === 'preview' && streamReady" class="pill ok"><span class="dot ok"></span>LIGADO</span>
    <span x-show="stage === 'preview' && !streamReady && !streamErr" class="pill neutral">A iniciar câmara…</span>
    <span x-show="stage === 'preview' && streamErr" class="pill warn">Sem câmara</span>
  </div>

  <!-- ============== STAGE: PREVIEW (camera live + thumb strip) ============== -->
  <template x-if="stage === 'preview'">
    <div style="flex:1; padding: 18px 18px 0; display:flex; flex-direction:column; gap:14px;">
      <div class="cam-wrap">
        <video x-ref="video" x-show="!streamErr" playsinline muted autoplay></video>
        <div class="cam-guides" x-show="!streamErr">
          <div class="cam-corner tl"></div>
          <div class="cam-corner tr"></div>
          <div class="cam-corner bl"></div>
          <div class="cam-corner br"></div>
        </div>
        <div class="cam-hint" x-show="!streamErr">ENQUADRAR FOLHA · BOA LUZ</div>

        <!-- error overlay + file fallback -->
        <div x-show="streamErr" style="color:#fff; padding:24px; text-align:center; max-width:380px;">
          <div style="font-weight:600; margin-bottom:8px;">Câmara indisponível</div>
          <div style="font-size:13px; opacity:.8; margin-bottom:18px;" x-text="streamErr"></div>
          <label class="btn primary" style="cursor:pointer;">
            Escolher do telefone
            <input type="file" accept="image/*" capture="environment" multiple
                   @change="onFiles($event)" style="display:none;">
          </label>
          <button class="btn" type="button" @click="start()" style="margin-left:8px;">
            Tentar de novo
          </button>
        </div>
      </div>

      <!-- shutter row -->
      <div class="cam-bar" style="border-radius: 12px;">
        <div class="cam-meta">
          <div>FOTOS</div>
          <b x-text="photos.length"></b>
        </div>
        <button class="shutter" @click="shoot()" :disabled="!streamReady" aria-label="Tirar foto"></button>
        <div class="cam-meta" style="text-align:right;">
          <button class="btn primary lg" @click="goConfirm()" :disabled="photos.length === 0">
            Concluir
          </button>
        </div>
      </div>

      <!-- Thumbnail strip showing accumulated photos -->
      <div x-show="photos.length > 0" class="thumb-strip">
        <template x-for="(p, idx) in photos" :key="p.id">
          <div class="thumb">
            <img :src="p.url" :alt="'foto ' + (idx+1)">
            <span class="thumb-num" x-text="idx + 1"></span>
            <button class="thumb-x" @click="removePhoto(p.id)" aria-label="Remover foto">×</button>
          </div>
        </template>
      </div>
    </div>
  </template>

  <!-- ============== STAGE: CONFIRM (count + send all) ============== -->
  <template x-if="stage === 'confirm'">
    <div style="flex:1; padding:18px; display:flex; flex-direction:column; gap:14px;">
      <div class="card" style="text-align:center; padding:24px;">
        <div style="font-size:64px; line-height:1; margin-bottom:8px;" x-text="photos.length"></div>
        <div style="font-size:18px; color:var(--ink-2);">
          <span x-text="photos.length === 1 ? 'kanban capturado' : 'kanbans capturados'"></span>
        </div>
      </div>

      <!-- Mini grid of thumbnails for visual confirmation -->
      <div class="thumb-grid">
        <template x-for="(p, idx) in photos" :key="p.id">
          <div class="thumb-grid-item">
            <img :src="p.url" :alt="'foto ' + (idx+1)">
            <span class="thumb-num" x-text="idx + 1"></span>
          </div>
        </template>
      </div>

      <div class="alert ok">
        <span>Cada foto vai ser processada com OCR. Demora ~25s por foto.</span>
      </div>

      <div style="display:flex; gap:10px;">
        <button class="btn lg" style="flex:1;" @click="backToPreview()">Voltar</button>
        <button class="btn lg primary" style="flex:2;" @click="uploadAll()">
          Enviar <span x-text="photos.length"></span>
          <span x-text="photos.length === 1 ? 'kanban' : 'kanbans'"></span>
        </button>
      </div>
    </div>
  </template>

  <!-- ============== STAGE: UPLOADING (fast HTTP enqueue) ============== -->
  <template x-if="stage === 'uploading'">
    <div class="proc">
      <div class="spinner"></div>
      <div>
        <div style="font-size:18px; font-weight:600;">A enviar fotos</div>
        <div class="muted tiny" style="margin-top:4px;">
          <span x-text="uploadIdx + 1"></span> de <span x-text="photos.length"></span>
        </div>
      </div>
      <div style="width:100%; max-width:400px; height:8px; background:#3a3729; border-radius:4px; overflow:hidden;">
        <div :style="'width:' + (((uploadIdx) / photos.length) * 100) + '%; height:100%; background:var(--accent); transition: width 0.3s;'"></div>
      </div>
      <div class="muted tiny">Não fechar esta janela.</div>
    </div>
  </template>

  <!-- ============== STAGE: PROCESSING (R71 polling) ============== -->
  <template x-if="stage === 'processing'">
    <div style="flex:1; padding:18px; display:flex; flex-direction:column; gap:14px; overflow-y:auto;">
      <div class="card">
        <div class="card-h">
          <div class="card-h-title">A processar OCR</div>
          <div class="card-h-sub muted tiny">
            <span x-text="processingDone"></span> /
            <span x-text="pendingSheets.length"></span> fotos prontas
            <span x-show="queueDepth > 0"> · fila do servidor:
              <span x-text="queueDepth"></span>
            </span>
          </div>
        </div>
      </div>
      <template x-for="(s, idx) in pendingSheets" :key="s.sheet_id">
        <div class="card" style="padding:14px; display:flex; align-items:center; gap:12px;">
          <div style="width:48px; height:48px; border-radius:6px; overflow:hidden; background:#2a271f; flex-shrink:0;">
            <img :src="photoThumb(idx)" style="width:100%; height:100%; object-fit:cover;">
          </div>
          <div style="flex:1; min-width:0;">
            <div style="font-size:13px; font-weight:600;">
              Foto <span x-text="idx + 1"></span>
            </div>
            <div class="muted tiny" x-text="statusLabel(s.status)"></div>
          </div>
          <div style="flex-shrink:0;">
            <span x-show="s.status === 'pending'" class="dot warn"></span>
            <span x-show="s.status === 'extracted'" class="dot ok"></span>
            <span x-show="s.status === 'error'" class="dot crit"></span>
          </div>
        </div>
      </template>
      <div class="muted tiny" style="text-align:center; padding:8px;">
        Pode fechar a janela — as fotos continuam a processar no servidor.
        <br>Atualiza-se sozinho.
      </div>
    </div>
  </template>

  <!-- R114 — styles para botão confirmar + row destacada -->
  <style>
    .qtd-ok-btn {
      width: 32px; height: 32px;
      border: 1.5px solid var(--rule-2);
      background: #fff;
      border-radius: 50%;
      font-size: 16px; line-height: 1;
      cursor: pointer;
      color: #aaa;
      transition: all 0.1s;
    }
    .qtd-ok-btn:active { transform: scale(0.92); }
    .qtd-ok-btn.active {
      background: #2F7D43;
      color: #fff;
      border-color: #2F7D43;
    }
    .qtd-row-confirmed {
      background: #f0f7e8 !important;
    }
  </style>

  <!-- ============== STAGE: QTD-CONFIRM (mobile-only edit) ============== -->
  <template x-if="stage === 'qtd_confirm'">
    <div style="flex:1; padding:18px; display:flex; flex-direction:column; gap:14px; overflow-y:auto;">
      <div class="card">
        <div class="card-h">
          <div class="card-h-title">Confirmar quantidades</div>
          <div class="card-h-sub muted tiny">
            <span x-text="photos.length"></span>
            <span x-text="photos.length === 1 ? 'folha pronta' : 'folhas prontas'"></span> ·
            edita só QTD se for necessário
          </div>
        </div>
      </div>

      <template x-for="sheet in qtdSheets" :key="sheet.sheet_id">
        <div class="card">
          <div class="card-h" style="padding:8px 12px;">
            <div>
              <div class="card-h-title" style="font-size:13px;">
                <span x-text="sheet.operador || '—'"></span> · <span x-text="sheet.data || '—'"></span>
                <template x-if="sheet.template_name && sheet.template_name !== 'bobine_formato'">
                  <span class="pill neutral" style="font-size:9px; margin-left:6px;"
                        x-text="sheet.template_name.replace(/_/g, ' ')"></span>
                </template>
              </div>
              <div class="muted tiny">
                Folha #<span x-text="sheet.sheet_id"></span> ·
                <span x-text="sheet.rows.length"></span>
                <span x-text="sheet.rows.length === 1 ? ' linha' : ' linhas'"></span>
              </div>
            </div>
          </div>
          <div class="card-b" style="padding:0;">
            <table style="width:100%; border-collapse:collapse;" class="qtd-table">
              <thead>
                <tr style="background:var(--paper-2); font-size:11px;">
                  <th style="text-align:left; padding:6px 8px; width:32px;">#</th>
                  <th style="text-align:left; padding:6px 8px; width:80px;">OF</th>
                  <th style="text-align:left; padding:6px 8px;">Modelo</th>
                  <th style="text-align:right; padding:6px 8px; width:60px;">QTD</th>
                  <template x-if="hasCesta(sheet)">
                    <th style="text-align:right; padding:6px 8px; width:70px;">CESTA</th>
                  </template>
                </tr>
              </thead>
              <tbody>
                <template x-for="row in sheet.rows" :key="row.row_index">
                  <tr style="border-top:1px solid var(--rule);">
                    <td class="mono tiny" style="padding:8px;" x-text="row.row_index + 1"></td>
                    <td class="mono tiny" style="padding:8px; font-weight:600;"
                        x-text="row.of || '—'"></td>
                    <td class="mono tiny" style="padding:8px;">
                      <span x-text="row.modelo || '—'"></span>
                      <div class="muted" style="font-size:10px;" x-text="row.cliente"></div>
                    </td>
                    <td style="padding:6px 8px;">
                      <input type="text" inputmode="numeric"
                             :value="row.qtd"
                             @input="row.qtd = $event.target.value"
                             style="width:100%; padding:6px; text-align:right;
                                    font-family:var(--font-mono); font-size:14px;
                                    border:1px solid var(--rule-2); border-radius:4px;">
                    </td>
                    <template x-if="hasCesta(sheet)">
                      <td style="padding:6px 8px;">
                        {# R122 — cesta é campo de texto livre, sem pattern #}
                        <input type="text" inputmode="numeric"
                               placeholder="cesta"
                               :value="row.cesta_n"
                               @input="row.cesta_n = $event.target.value"
                               style="width:100%; padding:6px; text-align:right;
                                      font-family:var(--font-mono); font-size:14px;
                                      border:1px solid var(--rule-2); border-radius:4px;">
                      </td>
                    </template>
                  </tr>
                </template>
              </tbody>
              <tfoot>
                <tr style="background:var(--paper-2); border-top:2px solid var(--rule-2);">
                  <td colspan="3" style="padding:8px; font-weight:600;">
                    Total colunas produzidas
                  </td>
                  <td :colspan="hasCesta(sheet) ? 2 : 1" style="padding:6px 8px;">
                    <input type="text" inputmode="numeric"
                           :value="sheet.colunas_produzidas"
                           @input="sheet.colunas_produzidas = $event.target.value"
                           style="width:100%; padding:6px; text-align:right;
                                  font-family:var(--font-mono); font-size:14px; font-weight:600;
                                  border:1px solid var(--rule-2); border-radius:4px;">
                  </td>
                </tr>
              </tfoot>
            </table>
          </div>
        </div>
      </template>

      <div style="display:flex; gap:10px;">
        <button class="btn lg" style="flex:1;" @click="skipConfirm()">Saltar</button>
        <button class="btn lg primary" style="flex:2;"
                @click="submitQtds()" :disabled="savingQtds">
          <span x-show="!savingQtds">Confirmar e gravar</span>
          <span x-show="savingQtds" style="display:flex; align-items:center; gap:8px;">
            <span class="spinner" style="width:16px; height:16px; border-width:2px;"></span>
            <span>A gravar...</span>
          </span>
        </button>
      </div>
    </div>
  </template>

  <!-- ============== STAGE: DONE (success) ============== -->
  <template x-if="stage === 'done'">
    <div class="proc">
      <div style="font-size:80px; line-height:1;">✓</div>
      <div style="font-size:24px; font-weight:600;">
        <span x-text="photos.length"></span>
        <span x-text="photos.length === 1 ? 'kanban gravado' : 'kanbans gravados'"></span>
      </div>
      <div class="muted">Bom trabalho!</div>
      <button class="btn lg primary" @click="reset()" style="margin-top:24px;">
        Tirar mais fotos
      </button>
    </div>
  </template>

  <canvas x-ref="canvas" style="display:none;"></canvas>
</div>

<style>
.thumb-strip {
  display:flex; gap:8px; overflow-x:auto; padding:4px 0;
  scrollbar-width: thin;
}
.thumb {
  position:relative; flex-shrink:0; width:84px; height:108px;
  border-radius:8px; overflow:hidden; background:#2a271f;
}
.thumb img { width:100%; height:100%; object-fit:cover; display:block; }
.thumb-num {
  position:absolute; top:4px; left:4px;
  background:rgba(0,0,0,0.7); color:#fff;
  font-size:11px; font-weight:600; padding:2px 6px; border-radius:4px;
}
.thumb-x {
  position:absolute; top:4px; right:4px;
  background:rgba(220,40,40,0.85); color:#fff; border:none;
  width:20px; height:20px; border-radius:50%;
  font-size:14px; line-height:1; cursor:pointer;
  display:flex; align-items:center; justify-content:center; padding:0;
}
.thumb-grid {
  display:grid; gap:8px;
  grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
}
.thumb-grid-item {
  position:relative; aspect-ratio: 3/4;
  border-radius:8px; overflow:hidden; background:#2a271f;
}
.thumb-grid-item img { width:100%; height:100%; object-fit:cover; display:block; }
</style>

<script>
function captureApp() {
  return {
    stage: 'preview',         // preview | confirm | uploading | processing | qtd_confirm | done
    streamReady: false,
    streamErr: '',
    photos: [],               // [{ id, blob, url }]
    uploadIdx: 0,
    uploadedSheetIds: [],     // sheet_ids returned by /upload?return=json
    pendingSheets: [],        // [{ sheet_id, status, error_message }] — R71 polling
    queueDepth: 0,            // R71 — server-side queue size (informational)
    _pollTimer: null,         // R71 — setInterval handle
    qtdSheets: [],            // payload from GET /mobile/qtds for editing QTDs
    savingQtds: false,
    _stream: null,
    _photoCounter: 0,
    _backLockArmed: false,
    _boundPopState: null,    // R66 — bound reference so removeEventListener actually works
    _boundVisibility: null,  // R66 — visibilitychange listener for iOS Safari resume

    // R66 — Alpine lifecycle: bind visibility handler once
    init() {
      this._boundVisibility = () => {
        if (!document.hidden && this.stage === 'preview' && !this.streamReady) {
          this.start();
        }
      };
      document.addEventListener('visibilitychange', this._boundVisibility);
    },
    destroy() {
      if (this._boundVisibility) {
        document.removeEventListener('visibilitychange', this._boundVisibility);
        this._boundVisibility = null;
      }
      if (this._pollTimer) {
        clearInterval(this._pollTimer);
        this._pollTimer = null;
      }
      this.disarmBackLock();
      this.stopStream();
    },

    // Round 50 — lock browser back button after upload completes so the
    // operator can't accidentally undo finalised work. Stays armed on
    // 'uploading', 'qtd_confirm' and 'done' stages. Cleared on reset().
    // R66 fix: store bound reference so removeEventListener actually removes
    // the listener (previously each .bind(this) created a fresh function and
    // listeners accumulated across capture cycles, inflating history stack
    // and breaking touch handlers on iOS Safari — required a manual refresh).
    armBackLock() {
      if (this._backLockArmed) return;
      this._backLockArmed = true;
      this._boundPopState = this._onPopState.bind(this);
      history.pushState({ locked: true }, '', location.href);
      window.addEventListener('popstate', this._boundPopState);
    },
    _onPopState(e) {
      // Block any attempt to navigate back during a locked stage.
      const lockedStages = ['uploading', 'qtd_confirm', 'done'];
      if (lockedStages.includes(this.stage)) {
        history.pushState({ locked: true }, '', location.href);
      }
    },
    disarmBackLock() {
      if (!this._backLockArmed) return;
      this._backLockArmed = false;
      if (this._boundPopState) {
        window.removeEventListener('popstate', this._boundPopState);
        this._boundPopState = null;
      }
    },

    async start() {
      // R66 — idempotent: reset visible state + release any old stream so
      // a re-entry (backToPreview, reset, visibilitychange) produces a
      // coherent state regardless of what came before.
      this.streamReady = false;
      this.streamErr = '';
      if (this._stream) {
        this._stream.getTracks().forEach(t => t.stop());
        this._stream = null;
      }
      if (!navigator.mediaDevices?.getUserMedia) {
        this.streamErr = 'Browser sem suporte a câmara.';
        return;
      }
      try {
        this._stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width:  { ideal: 1920 },
            height: { ideal: 1080 },
          },
          audio: false,
        });
        // R66 — the <video> element lives inside <template x-if="stage === 'preview'">.
        // After a state transition (reset / backToPreview), Alpine re-renders the
        // template asynchronously, so $refs.video may not be in the DOM yet. Wait
        // up to ~1 s for it to appear, otherwise the stream gets orphaned (camera
        // is granted — iOS green dot lights up — but the video never receives it,
        // streamReady stays false, shutter stays disabled, looking like a freeze).
        let attempts = 0;
        while (!this.$refs.video && attempts < 20) {
          await new Promise(r => setTimeout(r, 50));
          attempts++;
        }
        const v = this.$refs.video;
        if (v) {
          v.srcObject = this._stream;
          await v.play().catch(() => {});
          this.streamReady = true;
        } else {
          this.streamErr = 'Elemento de vídeo não montou — recarregar página.';
          this._stream.getTracks().forEach(t => t.stop());
          this._stream = null;
        }
      } catch (e) {
        this.streamErr = e.message || 'Sem acesso à câmara';
        this.streamReady = false;
      }
    },

    stopStream() {
      if (this._stream) {
        this._stream.getTracks().forEach(t => t.stop());
        this._stream = null;
      }
      this.streamReady = false;
    },

    shoot() {
      const v = this.$refs.video;
      if (!v || !v.videoWidth) return;
      const c = this.$refs.canvas;
      const maxW = 1600;
      const ratio = Math.min(1, maxW / Math.max(v.videoWidth, v.videoHeight));
      c.width = Math.round(v.videoWidth * ratio);
      c.height = Math.round(v.videoHeight * ratio);
      c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
      c.toBlob(b => {
        if (!b) return;
        this._photoCounter++;
        this.photos.push({
          id: this._photoCounter,
          blob: b,
          url: URL.createObjectURL(b),
        });
        // Brief flash effect for feedback (could enhance later)
      }, 'image/jpeg', 0.85);
    },

    onFiles(ev) {
      const files = Array.from(ev.target.files || []);
      for (const f of files) {
        this._photoCounter++;
        this.photos.push({
          id: this._photoCounter,
          blob: f,
          url: URL.createObjectURL(f),
        });
      }
    },

    removePhoto(id) {
      const idx = this.photos.findIndex(p => p.id === id);
      if (idx >= 0) {
        URL.revokeObjectURL(this.photos[idx].url);
        this.photos.splice(idx, 1);
      }
    },

    goConfirm() {
      if (this.photos.length === 0) return;
      this.stopStream();
      this.stage = 'confirm';
    },

    backToPreview() {
      this.stage = 'preview';
      // R66 — wait for the preview template (with <video>) to mount before
      // start() tries to attach the stream. Without this the stream is
      // acquired but $refs.video is undefined → orphan stream.
      this.$nextTick(() => this.start());
    },

    async uploadAll() {
      // R71 — split into 2 phases. Phase 1: POST each photo to /upload
      // (server enqueues, returns near-instantly). Phase 2: poll
      // /sheet/{id}/status every 2s until all OCRs finish in the
      // background. Eliminates the 90s client timeout that triggered
      // when multiple users captured simultaneously.
      if (this.photos.length === 0) return;
      this.stage = 'uploading';
      this.armBackLock();
      this.uploadIdx = 0;
      this.uploadedSheetIds = [];
      this.pendingSheets = [];
      const totalCount = this.photos.length;
      let failures = [];

      // ---- Phase 1: enqueue all photos ----
      for (let i = 0; i < this.photos.length; i++) {
        this.uploadIdx = i;
        const photo = this.photos[i];
        const fd = new FormData();
        fd.append('image', photo.blob, `kanban_${i+1}.jpeg`);
        try {
          // /upload now just enqueues + returns; 30s is plenty for image upload
          const ctrl = new AbortController();
          const timer = setTimeout(() => ctrl.abort(), 30_000);
          const res = await fetch('/upload?return=json', {
            method: 'POST',
            body: fd,
            signal: ctrl.signal,
          });
          clearTimeout(timer);
          if (res.ok) {
            const body = await res.json().catch(() => ({}));
            if (body.sheet_id) {
              this.uploadedSheetIds.push(body.sheet_id);
              this.pendingSheets.push({
                sheet_id: body.sheet_id,
                status: body.status || 'pending',
                error_message: null,
              });
            } else {
              failures.push({i: i+1, reason: body.error || 'no sheet_id'});
            }
          } else {
            failures.push({i: i+1, reason: `HTTP ${res.status}`});
          }
        } catch (e) {
          console.error(`[upload ${i+1}/${totalCount}] error:`, e);
          failures.push({i: i+1, reason: e.name === 'AbortError' ? 'upload timeout' : e.message});
        }
      }
      this.uploadIdx = totalCount;

      if (failures.length > 0 && this.uploadedSheetIds.length === 0) {
        // Total failure — show alert and bail out
        const msg = failures.map(f => `Foto ${f.i}: ${f.reason}`).join('\n');
        alert(`Nenhuma foto enviada.\n\nFalharam:\n${msg}`);
        this.stage = 'done';
        return;
      }
      if (failures.length > 0) {
        const msg = failures.map(f => `Foto ${f.i}: ${f.reason}`).join('\n');
        alert(`${this.uploadedSheetIds.length} de ${totalCount} enviadas.\n\nFalharam:\n${msg}`);
      }

      // ---- Phase 2: poll until all finish OCR in background ----
      this.stage = 'processing';
      this.startPolling();
    },

    get processingDone() {
      return this.pendingSheets.filter(
        s => s.status === 'extracted' || s.status === 'error'
      ).length;
    },

    statusLabel(status) {
      if (status === 'extracted') return '✓ Pronto';
      if (status === 'error') return '✗ Erro';
      if (status === 'pending') return 'A aguardar OCR…';
      return status || '—';
    },

    photoThumb(idx) {
      return this.photos[idx] && this.photos[idx].url
        ? this.photos[idx].url
        : '';
    },

    startPolling() {
      if (this._pollTimer) clearInterval(this._pollTimer);
      // Immediate first poll, then every 2s
      this.pollOnce();
      this._pollTimer = setInterval(() => this.pollOnce(), 2000);
    },

    async pollOnce() {
      const pending = this.pendingSheets.filter(s => s.status === 'pending');
      if (pending.length === 0) {
        this.onAllDone();
        return;
      }
      // Poll each pending sheet in parallel
      await Promise.all(pending.map(async (s) => {
        try {
          const res = await fetch(`/sheet/${s.sheet_id}/status`);
          if (!res.ok) return;
          const body = await res.json();
          s.status = body.status;
          s.error_message = body.error_message || null;
          this.queueDepth = body.queue_size || 0;
        } catch (e) {
          console.error(`[poll ${s.sheet_id}]`, e);
        }
      }));
      // Re-check after updates
      const stillPending = this.pendingSheets.filter(s => s.status === 'pending');
      if (stillPending.length === 0) {
        this.onAllDone();
      }
    },

    async onAllDone() {
      if (this._pollTimer) {
        clearInterval(this._pollTimer);
        this._pollTimer = null;
      }
      // Only proceed to qtd_confirm with sheets that extracted successfully
      const okIds = this.pendingSheets
        .filter(s => s.status === 'extracted')
        .map(s => s.sheet_id);
      this.uploadedSheetIds = okIds;
      if (okIds.length === 0) {
        this.stage = 'done';
        return;
      }
      await this.loadQtds();
      if (this.qtdSheets.length > 0) {
        this.stage = 'qtd_confirm';
      } else {
        this.stage = 'done';
      }
    },

    async loadQtds() {
      try {
        const ids = this.uploadedSheetIds.join(',');
        console.log(`[loadQtds] requesting /mobile/qtds?ids=${ids}`);
        const res = await fetch(`/mobile/qtds?ids=${encodeURIComponent(ids)}`);
        console.log(`[loadQtds] HTTP ${res.status}`);
        if (!res.ok) { this.qtdSheets = []; return; }
        const body = await res.json();
        console.log(`[loadQtds] received ${(body.sheets || []).length} sheets`);
        this.qtdSheets = body.sheets || [];
      } catch (e) {
        console.error(`[loadQtds] error:`, e);
        this.qtdSheets = [];
      }
    },

    // R114 — helpers para cesta (R122: removidos helpers de confirmação)
    hasCesta(sheet) {
      return Array.isArray(sheet.row_fields_extra)
        && sheet.row_fields_extra.includes('cesta_n');
    },
    get anyCesta() {
      return this.qtdSheets.some(s => this.hasCesta(s));
    },

    async submitQtds() {
      if (this.savingQtds) return;

      // R123 — o mobile grava as quantidades (qtd, cesta_n,
      // colunas_produzidas) mas NÃO valida a folha. Cruzar o operador é
      // automático; validar é um acto humano deliberado, feito no desktop
      // (revertido o auto-validate de Expedição do R122).
      this.savingQtds = true;
      const edits = [];
      for (const s of this.qtdSheets) {
        for (const r of s.rows) {
          edits.push({
            sheet_id: s.sheet_id,
            field_path: `rows[${r.row_index}].qtd`,
            value: String(r.qtd ?? ''),
          });
          if (this.hasCesta(s)) {
            edits.push({
              sheet_id: s.sheet_id,
              field_path: `rows[${r.row_index}].cesta_n`,
              value: String(r.cesta_n ?? ''),
            });
          }
        }
        edits.push({
          sheet_id: s.sheet_id,
          field_path: 'footer.colunas_produzidas',
          value: String(s.colunas_produzidas ?? ''),
        });
      }
      try {
        const res = await fetch('/mobile/qtds-batch', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({edits}),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok || body.ok === false || (body.errors || []).length > 0) {
          const first = (body.errors || [])[0];
          const detail = first && first.error ? first.error : `HTTP ${res.status}`;
          throw new Error(detail);
        }
      } catch (e) {
        alert('Erro a gravar quantidades: ' + e.message);
        this.savingQtds = false;
        return;
      }
      this.savingQtds = false;
      this.stage = 'done';
    },

    skipConfirm() {
      // Operator chose not to edit QTDs — proceed to done with existing values
      this.stage = 'done';
    },

    reset() {
      // Round 50 — disarm back-lock when starting fresh capture
      this.disarmBackLock();
      // Clean up object URLs to avoid memory leak
      for (const p of this.photos) URL.revokeObjectURL(p.url);
      this.photos = [];
      this.uploadIdx = 0;
      this.uploadedSheetIds = [];
      this.qtdSheets = [];
      this.savingQtds = false;
      this._photoCounter = 0;
      this.streamErr = '';
      this.stage = 'preview';
      // R66 — defer start() to next tick so the <template x-if="stage==='preview'">
      // mounts the <video x-ref="video"> element before we try to attach the
      // MediaStream. Without this, the stream is acquired (iOS shows the green
      // dot) but $refs.video is undefined → stream is orphaned, streamReady
      // stays false, all buttons appear frozen (the symptom user reported).
      this.$nextTick(() => this.start());
    },
  };
}
</script>
