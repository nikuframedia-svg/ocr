[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metalogalva-ocr"
version = "0.1.0"
description = "OCR pipeline for Metalogalva industrial Kanban production sheets"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "NIKUFRA.AI" }]
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "httpx>=0.27,<1",
    "structlog>=24.1",
    "rich>=13.7",
    "jinja2>=3.1",
    "pillow>=10.3",
    # Phase 0.5 preprocessing (deskew, CLAHE). headless build avoids GUI deps.
    "opencv-python-headless>=4.10",
    "numpy>=1.26,<3",
    # rev01 — ingestão de PDF de kanbans (rasteriza páginas → 1 imagem/folha).
    # pypdfium2 = wrapper do PDFium do Google/Chromium: licença permissiva
    # (Apache/BSD, ao contrário do PyMuPDF/AGPL), wheel abi3 self-contained,
    # sem binário de sistema (poppler mataria o `uv sync` offline no Windows).
    "pypdfium2>=4.30",
    # R121 — completar deps runtime que faltavam (servidor web, refs Excel,
    # string matching, learning). Antes destas, `pip install -e .` em máquina
    # nova falhava ao arrancar o uvicorn.
    "uvicorn[standard]>=0.30",
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "ollama>=0.3",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "aiofiles>=23",
    "rapidfuzz>=3.6",
    "python-Levenshtein>=0.25",
    "scikit-learn>=1.4",
    "unidecode>=1.3",
    "regex>=2024.0",
    "python-dateutil>=2.9",
    # Importado por app/pipeline/sql_validator.py (produção). Estava a faltar às
    # dependências declaradas — só existia por instalação manual no venv, pelo
    # que um `uv sync` limpo (fábrica) partia o sql_validator. Declarado agora.
    "sqlglot>=25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-Pillow",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.hatch.build.targets.wheel.sources]
"backend/app" = "app"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["inputs"]  # legacy reference code (_factory_test/factory_ocr.py), not ours

[tool.ruff.lint]
select = [
    "E", "F", "W",       # pycodestyle, pyflakes
    "I",                  # isort
    "B",                  # flake8-bugbear
    "UP",                 # pyupgrade
    "SIM",                # flake8-simplify
    "TID",                # flake8-tidy-imports
    "PL",                 # pylint
    "RUF",
]
ignore = [
    "PLR0913",  # too many arguments — sometimes unavoidable in pipeline code
    "PLR2004",  # magic numbers — fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101", "PLC0415"]  # imports inside fixtures are idiomatic
"scripts/**" = ["T201", "PLR0915", "PLR0912"]  # print is OK in CLIs; main() can be long and branch-heavy
"backend/app/observability/logger.py" = ["PLW0603"]  # intentional one-time init flag

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["app.*"]
strict = true

[[tool.mypy.overrides]]
module = ["scripts.*", "tests.*"]
ignore_errors = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=backend/app",
    "--cov-report=term-missing",
    "--cov-fail-under=70",
]
testpaths = ["tests"]
pythonpath = ["backend"]
markers = [
    "vllm: integration tests requiring a running vLLM service",
]

[tool.coverage.run]
source = ["backend/app"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
